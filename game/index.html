<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Vault — a heist game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; background: #0d1526; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Midnight Vault: crack three safes and escape the bank without tripping the alarm"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/vault-main.js"></script>
</body>
</html>
